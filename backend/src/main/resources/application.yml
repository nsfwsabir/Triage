spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://127.0.0.1:3306/triage_db}
    username: ${SPRING_DATASOURCE_USERNAME:triage}
    password: ${SPRING_DATASOURCE_PASSWORD:triage}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:triage-local-dev-secret-key-0123456789abcdef0123456789abcdef}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}

server:
  port: ${PORT:8080}
